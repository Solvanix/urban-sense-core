name: Publish public index and visualize

on:
  push:
    branches: [main]
    paths:
      - "public-index/**"
      - "visualize/**"
      - "apps/pizza-hot/**"
      - ".github/workflows/publish-index-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "public-index-and-visualize-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R public-index/. _site/
          mkdir -p _site/visualize
          cp -R visualize/. _site/visualize/
          test -f _site/visualize/index.html
          test -f _site/visualize/data/dashboard.json
          mkdir -p _site/pizza-hot
          cp -R apps/pizza-hot/. _site/pizza-hot/
          rm -f _site/pizza-hot/.env _site/pizza-hot/.env.local _site/pizza-hot/.env.local.ready
          test -f _site/pizza-hot/index.html
          test -f _site/pizza-hot/catalog.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
