name: Publish public index

on:
  push:
    branches: [main]
    paths:
      - "public-index/**"
      - ".github/workflows/publish-index-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "public-index-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public index artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-index
      - name: Deploy public index
        id: deployment
        uses: actions/deploy-pages@v4
