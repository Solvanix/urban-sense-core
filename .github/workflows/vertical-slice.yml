name: Vertical Slice Analytics

on:
  push:
    paths:
      - "analytics/vertical_slice/**"
      - "visualize/**"
      - ".github/workflows/vertical-slice.yml"
  pull_request:
    paths:
      - "analytics/vertical_slice/**"
      - "visualize/**"
      - ".github/workflows/vertical-slice.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic dashboard
        run: python3 analytics/vertical_slice/analyze.py
      - name: Run analytics tests
        run: python3 -m unittest analytics/vertical_slice/test_analyze.py -v
      - name: Validate JSON output
        run: python3 -m json.tool visualize/data/dashboard.json >/dev/null
      - name: Validate browser script syntax
        run: node --check visualize/app.js
