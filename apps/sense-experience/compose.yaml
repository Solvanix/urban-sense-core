services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - sense_experience_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  schema:
    build: .
    command: pnpm db:migrate
    environment:
      SENSE_EXPERIENCE_DATABASE_URL: ${SENSE_EXPERIENCE_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      PORT: 3000
      SENSE_EXPERIENCE_DATABASE_URL: ${SENSE_EXPERIENCE_DATABASE_URL}
      SENSE_EXPERIENCE_ACCEPT_REAL_DATA: ${SENSE_EXPERIENCE_ACCEPT_REAL_DATA:-false}
      SENSE_EXPERIENCE_OIDC_ISSUER: ${SENSE_EXPERIENCE_OIDC_ISSUER:-}
      SENSE_EXPERIENCE_OIDC_CLIENT_ID: ${SENSE_EXPERIENCE_OIDC_CLIENT_ID:-}
      SENSE_EXPERIENCE_OIDC_CLIENT_SECRET: ${SENSE_EXPERIENCE_OIDC_CLIENT_SECRET:-}
      SENSE_EXPERIENCE_OIDC_REDIRECT_URI: ${SENSE_EXPERIENCE_OIDC_REDIRECT_URI:-}
      SENSE_EXPERIENCE_WEB_ORIGIN: ${SENSE_EXPERIENCE_WEB_ORIGIN}
      SENSE_EXPERIENCE_REVIEWER_SESSION_SECRET: ${SENSE_EXPERIENCE_REVIEWER_SESSION_SECRET:-}
    depends_on:
      schema:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  sense_experience_mysql:
